name: SupplyHog
description: >-
  SupplyHog is an ecommerce platform built specifically for hardware and building-materials
  retailers, giving independent hardware and building-supply stores a branded online storefront
  to sell their products. The platform provides co-op and custom product catalogs, flexible
  fulfillment (in-store pickup, ship-to-store, local delivery, and ship-to-home with Shippo
  shipping labels), Stripe-powered payments, TaxJar tax calculation, real-time ERP inventory and
  pricing synchronization, custom branding and domains, location-aware search, and admin tools for
  order fulfillment and abandoned-cart recovery. Founded in 2010 as the Nopone.com reverse-auction
  marketplace, SupplyHog went through the DreamIt and 500 Startups accelerators, pivoted to full
  ecommerce services, and was acquired by construction-supply retailer R.P. Lumber in 2016. It does
  not publish a public developer API surface; it acts as a consumer of Stripe, TaxJar, and Shippo.
